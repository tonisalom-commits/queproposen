name: Comprova i publica el web Astro

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v7
      - name: Prepara Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instal·la dependències
        run: npm install --no-audit --no-fund
      - name: Valida les dades i compila Astro
        run: npm run build
      - name: Adjunta la vista prèvia compilada a la sol·licitud de fusió
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: queproposen-vista-previa
          path: dist/
          retention-days: 14
      - name: Desa el web compilat (només branca principal)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
