name: Integra auditoria ambiental XV i controla omissions

on:
  push:
    branches: [feat/prototip-atles-pnl]
    paths:
      - ".github/workflows/integra-auditoria-ambient-xv.yml"
      - "scripts/integra_auditoria_ambient_xv.py"
      - "scripts/estima_omissions_mostra_xv.py"
      - "tests/test_estima_omissions_mostra_xv.py"
      - "tests/test_integra_auditoria_ambient_xv.py"
      - "data/treball/auditoria_mediambient_lot*.csv"
      - "data/treball/cua_ambient_xv_830_conciliada.csv"
      - "data/treball/univers_congres_xv_5094.csv"
      - "data/treball/fora_cua_xv_4264.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auditoria-ambiental-xv
  cancel-in-progress: false

jobs:
  integra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recupera branca de treball
        uses: actions/checkout@v4
        with:
          ref: feat/prototip-atles-pnl
          persist-credentials: true
      - name: Instal·la Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executa proves unitàries sense connexió
        run: python -m unittest discover -s tests -v
      - name: Genera inventari anotat, lot de 40 i control de 4.264
        run: |
          set -euo pipefail
          python scripts/integra_auditoria_ambient_xv.py
          python scripts/estima_omissions_mostra_xv.py
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('data/treball')
          def read(p):
              with (root/p).open(encoding='utf-8-sig',newline='') as f:
                  return list(csv.DictReader(f))
          rows=read('inventari_ambient_xv_revisat.csv')
          assert len({x['expedient'] for x in rows})==len(rows)
          assert sum(bool(x['decisio_auditoria']) for x in rows)>=4
          assert len(read('control_omissions_fora_cua_xv.csv'))==4264
          assert len(read('mostra_control_fora_cua_xv_100.csv'))==100
          assert len(read('mostra_aleatoria_fora_cua_xv_100.csv'))==100
          est=json.loads((root/'diagnostic_provisional_omissions_mostra_xv.json').read_text())
          assert est['mostra_total']==100
          assert sum(est['repartiment'].values())==100
          assert est['grau']=='DIAGNOSTIC_PROVISIONAL_SENSE_INTERVAL_DE_CONFIANCA'
          meta=json.loads((root/'manifest_mostra_aleatoria_fora_cua_xv.json').read_text())
          assert meta['mida']==100
          assert len(meta['estrats'])==7
          assert sum(x['seleccionats'] for x in meta['estrats'].values())==100
          assert sum(x['poblacio'] for x in meta['estrats'].values())==4264
          assert len(read('cua_omissions_prioritaries_xv.csv'))>=1
          assert len(read('cua_lot02_40.csv'))==40
          report=json.loads((root/'resum_auditoria_ambient_xv.json').read_text())
          assert report['univers']==5094 and report['fora_cua']==4264
          assert len(rows)==report['total_inventari_revisat']
          assert report['total_inventari_revisat']==830+report['decisions_recuperades_de_fora_cua']
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Desa dades només a la branca de treball
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treball/inventari_ambient_xv_revisat.csv \
            data/treball/cua_lot02_40.csv \
            data/treball/control_omissions_fora_cua_xv.csv \
            data/treball/cua_omissions_prioritaries_xv.csv \
            data/treball/mostra_control_fora_cua_xv_100.csv \
            data/treball/mostra_aleatoria_fora_cua_xv_100.csv \
            data/treball/manifest_mostra_aleatoria_fora_cua_xv.json \
            data/treball/diagnostic_provisional_omissions_mostra_xv.json \
            data/treball/resum_auditoria_ambient_xv.json
          if git diff --cached --quiet; then
            echo "Resultats regenerats sense canvis"
          else
            git commit -m "Integra decisions ambientals auditades i conserva control d'omissions"
            # Altres fluxos poden haver afegit dades a la mateixa branca.
            # Rebasam i repetim davant canvis concurrents, sense force-push.
            publicat=0
            for intent in 1 2 3 4; do
              git pull --rebase origin feat/prototip-atles-pnl
              if git push origin HEAD:feat/prototip-atles-pnl; then
                publicat=1
                break
              fi
              sleep 2
            done
            test "$publicat" -eq 1
          fi
