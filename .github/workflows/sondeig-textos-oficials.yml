name: Sondeig de textos primaris ambientals
on:
  push:
    branches: [feat/prototip-atles-pnl]
    paths:
      - scripts/sondeja_textos_oficials.py
      - .github/workflows/sondeig-textos-oficials.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet beautifulsoup4
      - run: python scripts/sondeja_textos_oficials.py
