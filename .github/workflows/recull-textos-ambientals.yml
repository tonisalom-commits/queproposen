name: Auditoria documental ambiental · XV legislatura
on:
  push:
    branches: [feat/prototip-atles-pnl]
    paths:
      - scripts/recull_textos_ambientals.py
      - .github/workflows/recull-textos-ambientals.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recuperacio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instal·la analitzador HTML
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Descarrega els índexs oficials auditatats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fonts1 fonts162
          gh run download 44623442503 -n inventari-ambiental-per-a-revisio -D fonts1
          gh run download 44624902860 -n serie-162-recollida-auditada -D fonts162
      - name: Recupera textos originals i deixa empremtes de les fonts
        run: python scripts/recull_textos_ambientals.py
      - name: Conserva índexs, evidència i registres d'incidències
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-documental-ambiental-xv
          path: evidencia-ambiental/
          retention-days: 14
