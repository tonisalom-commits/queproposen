name: Recupera evidència per a la mostra aleatòria XV

on:
  push:
    branches: [feat/prototip-atles-pnl]
    paths:
      - "scripts/recull_evidencia_mostra_aleatoria.py"
      - ".github/workflows/recull-mostra-aleatoria.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidencia-mostra-xv
  cancel-in-progress: false

jobs:
  recull:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prototip-atles-pnl
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paquets per a lectura oficial
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Recupera primera publicació de les fitxes del Congrés
        run: python scripts/recull_evidencia_mostra_aleatoria.py
      - name: Verifica recompte d'evidències sense autovalidar iniciatives
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("data/treball")
          s=json.loads((p/"resum_evidencia_mostra_aleatoria_xv.json").read_text())
          with (p/"evidencia_mostra_aleatoria_fora_cua_xv.csv").open(encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==s["pendents_al_comencament"]
          assert len(rows)==len({r["id"] for r in rows})
          assert s["mostra"]==100 and s["ja_auditats"]+len(rows)==100
          assert all(r["detall_lectura"] in ("SI","NO") for r in rows)
          print("FRAGMENTS",s["fragments_obtinguts"],"/",len(rows))
          PY
      - name: Conserva evidència reproduïble al registre de treball
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treball/evidencia_mostra_aleatoria_fora_cua_xv.csv data/treball/resum_evidencia_mostra_aleatoria_xv.json
          if ! git diff --cached --quiet; then
            git commit -m "Conserva fragments i incidències del control probabilístic ambiental XV"
            git push
          fi
